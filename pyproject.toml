[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nb-pdf-template-zh"
version = "0.1.0"
description = "Chinese adaptation of t-makaro/nb_pdf_template for XeLaTeX"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Tyler Makaro" },
  { name = "Kayro" }
]
urls = { "Homepage" = "https://github.com/jeoor/nb-pdf-template-zh" }
dependencies = ["nbconvert>=7,<8", "nbformat>=5,<6"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Development Status :: 4 - Beta",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Programming Language :: Python :: 3",
]

[tool.hatch.build.targets.wheel]
include = [
  "nb_pdf_template/**",
  "README.md",
  "LICENSE",
]

[project.entry-points."pygments.styles"]
jupyter_python = "nb_pdf_template:Jupyter_PythonStyle"

[tool.hatch.build.targets.wheel.shared-data]
"share/templates" = "share/jupyter/nbconvert/templates"

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "nb_pdf_template/THIRD_PARTY_NOTICES.md"
